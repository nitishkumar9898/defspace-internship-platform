version: "3.9"

services:
  backend:
    build: .
    container_name: defspace-backend
    restart: unless-stopped
    volumes:
      - defspace-db:/app/backend
    environment:
      - DATABASE_URL=sqlite:////app/backend/defspace.db
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.25-alpine
    container_name: defspace-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  defspace-db:
